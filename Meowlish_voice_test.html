<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meowlish 음성 테스트</title><style>body{font:17px system-ui;background:#fff5e6;color:#65452e;margin:0;padding:24px}main{max-width:480px;margin:auto;background:white;padding:24px;border-radius:24px}textarea,select,button{box-sizing:border-box;width:100%;font:inherit;margin:8px 0;padding:13px;border:1px solid #e1c7a7;border-radius:12px}button{background:#f3c487;font-weight:bold;color:#65452e}small{display:block;white-space:pre-wrap;overflow-wrap:anywhere}label{font-weight:bold}</style></head><body><main><h1>🐱 애홍이 음성 테스트</h1><p>Siri 4번 또는 사용 가능한 미국식 영어 음성을 확인해 보세요.</p><label for="phrase">영어 문장</label><textarea id="phrase" rows="4">Hey, are you doing anything this weekend? I was thinking we could grab a coffee and check out that new bookstore downtown.</textarea><label for="voice">테스트 음성</label><select id="voice"><option value="">자동 선택</option></select><button id="play">▶ 영어 듣기</button><button id="next">다른 문장</button><button id="stop">정지</button><button id="refresh">음성 목록 새로고침</button><small id="status" role="status">음성 목록 확인 중…</small></main><script>
const s=window.speechSynthesis, sel=document.querySelector('#voice'), status=document.querySelector('#status'), phrase=document.querySelector('#phrase');let voices=[],current,watch,index=0;const samples=[phrase.value,'I usually take the train to school, but today I decided to walk. The weather is beautiful.','Excuse me, could you tell me where the nearest subway station is?'];
function load(){if(!s){status.textContent='이 브라우저는 음성 합성을 지원하지 않습니다.';return}const old=sel.value;voices=s.getVoices().filter(v=>/^en\b/i.test(v.lang));sel.replaceChildren(new Option('자동 선택',''));voices.forEach((v,i)=>sel.add(new Option(v.name+' ('+v.lang+')',String(i))));if(old!==''&&voices[Number(old)])sel.value=old;status.textContent='영어 음성 '+voices.length+'개 발견\n'+(voices.length?voices.map(v=>v.name+' — '+v.lang).join('\n'):'목록이 비어 있어도 기본 영어 음성 재생을 시도할 수 있습니다.');}
function choose(){return voices.find(v=>/^en-US$/i.test(v.lang)&&/siri.*(?:voice\s*)?4\b/i.test(v.name))||voices.find(v=>/^en-US$/i.test(v.lang)&&/ava|samantha/i.test(v.name)&&/premium|enhanced/i.test(v.name))||voices.find(v=>/^en-US$/i.test(v.lang)&&/ava|samantha/i.test(v.name))||voices.find(v=>/^en-US$/i.test(v.lang))||voices[0];}
if(s){load();s.addEventListener('voiceschanged',load);setTimeout(load,1000)}else load();document.querySelector('#refresh').onclick=load;document.querySelector('#next').onclick=()=>{index=(index+1)%samples.length;phrase.value=samples[index]};document.querySelector('#stop').onclick=()=>{clearTimeout(watch);if(s)s.cancel();current=null;status.textContent='정지됨';};document.querySelector('#play').onclick=()=>{if(!s)return;if(!phrase.value.trim()){status.textContent='문장을 입력하세요.';return}clearTimeout(watch);s.cancel();const u=new SpeechSynthesisUtterance(phrase.value);current=u;const v=sel.value===''?choose():voices[Number(sel.value)];u.lang=v?.lang||'en-US';if(v)u.voice=v;u.rate=0.95;u.pitch=1;u.volume=1;const name=v?.name||'기기 기본 영어 음성';status.textContent='재생 요청: '+name;u.onstart=()=>{if(current!==u)return;clearTimeout(watch);status.textContent='재생 중: '+name};u.onend=()=>{if(current!==u)return;clearTimeout(watch);status.textContent='재생 완료: '+name;current=null};u.onerror=e=>{if(current!==u)return;clearTimeout(watch);status.textContent='재생 오류: '+e.error+'\nSafari에서 다시 열고 음량을 확인해 주세요.';current=null};watch=setTimeout(()=>{if(current===u)status.textContent='재생 시작 신호 없음. Safari에서 직접 열었는지 확인해 주세요.'},5000);s.speak(u);if(s.paused)s.resume();};
</script></body></html>
