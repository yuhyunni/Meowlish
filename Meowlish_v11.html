const defaults=()=>({name:'애홍이',level:'B1',skillLevels:{},xp:0,coins:0,weekly:0,done:{},earned:{},words:[],notes:[],read:{},skin:'cheer',owned:['cheer','cool','read','listen'],tested:false,club:'치즈 탐험대',day:new Date().toLocaleDateString('en-CA'),week:weekKey(),streak:0,lastStudy:''});
function weekKey(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA')}
let s;try{s={...defaults(),...JSON.parse(localStorage.getItem('meowlish-v1')||'{}')}}catch(e){s=defaults()}if(s.day!==defaults().day){s.done={};s.earned={};s.day=defaults().day}if(s.week!==weekKey()){s.weekly=0;s.week=weekKey()}
let screen='home', data={},toastTimer;const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('meowlish-v1',JSON.stringify(s))}catch(e){}}function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2200)}
function grant(k,n,unique){let key=k+':'+unique;if(s.earned[key])return 0;s.earned[key]=1;s.xp+=n;s.weekly+=n;s.coins+=Math.max(1,Math.floor(n/5));let now=s.day;if(s.lastStudy!==now){let prev=new Date();prev.setDate(prev.getDate()-1);s.streak=s.lastStudy===prev.toLocaleDateString('en-CA')?s.streak+1:1;s.lastStudy=now}save();return n}function finish(k,n=100){let p=grant(k,n,'complete');s.done[k]=true;if(skills.every(a=>s.done[a[0]])){let b=grant('all',150,'bonus');if(b)toast('전 영역 완료! +150 XP')}save();return p}function skillLevel(k){return s.skillLevels[k]||s.level}function li(k){return levels.indexOf(skillLevel(k))}function go(p){if(window.speechSynthesis)window.speechSynthesis.cancel();screen=p;data={};if(p==='vocab')data={i:0,answered:false,correct:0};if(p==='reading')data={page:s.read[skillLevel('reading')]||0,choice:-1};if(p==='speaking')data={turn:0,reveal:0,messages:[],mode:0,done:false};if(p==='listening')data={reveal:0,choice:-1};if(p==='test')data={i:0,score:0,selected:-1};if(p==='rank')data={tab:0};render();window.scrollTo(0,0)}
function nav(){let items=[['home','⌂','홈'],['learn','▤','학습'],['rank','🏆','리그'],['club','🐾','클럽'],['profile','☺','마이']];return `<nav class="nav">${items.map(([p,i,t])=>`<button class="${screen===p||(p==='learn'&&skills.some(a=>a[0]===screen))?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function header(){return `<header><div class="brand" onclick="go('home')" role="button" tabindex="0">meow<span>lish.</span> <small style="font-size:15px">🐾</small></div><div class="stats"><span class="pill">🔥 ${s.streak}</span><span class="pill">${moonCoinIcon()} ${s.coins}</span><span class="pill">⚡ ${s.xp}</span></div></header>`}function back(t,k){return `<button class="back" onclick="go('${k||'learn'}')">‹ 돌아가기</button><div class="row between"><h2>${t}</h2><span class="badge">${skillLevel(screen)}</span></div>`}
function tiles(){return `<div class="grid">${skills.map(([k,e,n,d,x,b])=>`<button class="tile ${s.done[k]?'done':''}" style="background:${b}" onclick="go('${k}')"><span class="xp">${s.done[k]?'✓ 완료':`완료 +${x} XP`}</span><span class="emoji">${e}</span><strong>${n}</strong><small>${d}</small></button>`).join('')}</div>`}
function home(){let n=skills.filter(a=>s.done[a[0]]).length;let mascotTalk=n===5?'오늘도 다 해냈다냥! 쉬엄쉬엄 복습도 해보자.':'오늘은 어떤 영어 미션부터 할까냥?';return `<div class="hero"><div><div class="eyebrow">YOUR STUDY BUDDY · ${s.level}</div><h1>${n===5?'오늘도 해냈다냥!':`안녕! ${esc(s.name)}와<br>영어 공부하자냥!`}</h1><div class="muted">하루 5가지, 조금씩 성장하기 · 문제당 +10 XP</div><div class="progress"><i style="width:${n*20}%"></i></div><div class="muted">오늘의 미션 ${n} / 5 완료</div><div class="speech">💬 ${mascotTalk}</div></div><div class="mascot-stage"><img alt="고양이 학습 친구" src="${IMG[s.skin]||IMG.cheer}"></div></div>${!s.tested?`<div class="card row between"><div><strong>내 영어 레벨은?</strong><div class="muted">짧은 CEFR 참고 진단으로 시작해요.</div></div><button class="btn" onclick="go('test')">테스트</button></div>`:''}<div class="card mascot-callout"><div class="mascot-mini-stage"><img class="mascot-inline cheer" src="${IMG[s.skin]||IMG.cheer}" alt="응원하는 고양이"></div><div class="speech"><strong>${esc(s.name)}</strong>가 네 공부를 응원 중이야. 단어를 맞히면 기뻐하고, 리스닝을 하면 같이 신나게 들어!</div></div><div class="sectionhead"><h2>오늘의 학습</h2><span class="muted">DAILY QUEST</span></div>${tiles()}<div class="sectionhead"><h2>고양이의 선물</h2></div><div class="card row between"><div><strong>🎁 올클리어 보너스</strong><div class="muted">5개 영역 완료 시 150 XP</div></div><button class="btn secondary" onclick="go('shop')">스킨 상점</button></div><div class="notice">문제 정답 또는 영작·대화 응답 제출마다 +10 XP, 단어 오답 복습 +5 XP. 같은 문제의 보상은 하루 한 번만 지급됩니다. 완료 보너스는 별도이며 기록은 이 브라우저에 저장됩니다. 리그는 모의 데이터입니다.</div>`}

function vocabView(){let qs=vocab[li('vocab')],q=qs[data.i];if(!q)return `<div class="card center"><img class="mascot-inline cheer" src="${IMG[s.skin]||IMG.cheer}"><h2>단어 세트 완료!</h2><div class="big">${data.correct}/${qs.length}</div><p>오늘의 단어 학습 보상을 받았어요.</p><button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('vocab')">다시 연습</button></div>`;return `${back('Vocabulary')}<div class="sectionhead"><span class="muted">문맥에 맞는 단어를 입력하세요.</span><strong>${data.i+1} / ${qs.length}</strong></div><div class="progress"><i style="width:${data.i/qs.length*100}%"></i></div><div class="card"><div class="eyebrow">FILL IN THE BLANK</div><div class="question">${q[0].replace('____','<span style="color:#d57c36">_______</span>')}</div><p>${q[1]}</p><input id="answer" placeholder="영어 단어 입력" autocomplete="off" autocapitalize="none" value="${esc(data.answer||'')}" ${data.answered?'disabled':''} onkeydown="if(event.key==='Enter')checkWord()">${data.answered?`<div class="feedback ${data.ok?'':'bad'}"><strong>${data.ok?'정답이다냥!':'기본 답안: '+q[2]}</strong><div>${q[4]}</div><div class="mini">${data.ok?`+${data.gained} XP`:'미등록 유의어일 수 있어요. 실제 AI 판단은 아직 연결되지 않았습니다.'}</div></div><button class="btn wide" onclick="nextWord()">다음 문제</button>`:`<button class="btn wide" onclick="checkWord()">정답 확인</button><button class="btn ghost wide" onclick="toast('힌트: ${q[2][0]}로 시작해요')">힌트</button>`}</div><div class="notice">현재는 문장별로 등록한 유의어를 인정하는 데모 채점입니다.</div>`}
function checkWord(){if(data.answered)return;let v=$('answer').value.trim();if(!v)return toast('단어를 입력해 주세요');let q=vocab[li('vocab')][data.i];data.answer=v;data.ok=q[3].includes(v.toLowerCase().replace(/[.!?]+$/,''));data.answered=true;data.gained=data.ok?grant('vocab',10,skillLevel('vocab')+data.i):0;if(data.ok)data.correct++;else if(!s.words.some(w=>w.word===q[2]))s.words.push({word:q[2],meaning:q[4]});save();render()}

function passageHTML(q){return q[1].split(/(\b[A-Za-z]+\b)/).map(t=>q[5][t.toLowerCase()]?`<span onclick="showWord('${t.toLowerCase()}')">${t}</span>`:esc(t)).join('')}function currentReading(){return (data.page%2===0?readings:extra)[li('reading')]}function showWord(w){let meaning=currentReading()[5][w];data.word=w;data.meaning=meaning;render()}function addWord(){if(!s.words.some(w=>w.word===data.word)){s.words.push({word:data.word,meaning:data.meaning});save()}toast('나의 단어장에 저장했어요')}

function readChoice(i){data.choice=i;data.passed=i===currentReading()[4];if(data.passed){let p=grant('reading',10,'question:'+skillLevel('reading')+':'+currentReading()[0]);finish('reading');s.read[skillLevel('reading')]=Math.max(s.read[skillLevel('reading')]||0,data.page+1);save();toast(p?`+${p} XP!`:'오늘 보상은 이미 받았어요')}render()}function nextRead(){data.page++;data.choice=-1;data.passed=false;data.word='';render();window.scrollTo(0,0)}

function countWords(t){return t.trim()?t.trim().split(/\s+/).length:0}function gradeWriting(){let t=$('essay').value.trim(),l=li('writing');if(countWords(t)<2||!/[a-z]/i.test(t))return toast('영어로 답안을 작성해 주세요');data.essay=t;let r=[];if(!/^[A-Z]/.test(t))r.push(['확인 필요','문장 첫 글자를 대문자로 시작하는지 확인하세요.']);if(!/[.!?]["']?$/.test(t))r.push(['확인 필요','문장 마지막에 적절한 문장부호를 사용했는지 확인하세요.']);if(/\bI am\b.*\byesterday\b|\byesterday\b.*\bI am\b/i.test(t))r.push(['확인 필요','yesterday와 현재형 am이 함께 있습니다. 과거 시제 was가 필요한지 확인하세요.']);if(/\bhe go\b|\bshe go\b|\bhe have\b|\bshe have\b/i.test(t))r.push(['확인 필요','3인칭 단수 주어와 동사의 일치를 확인하세요.']);if(l<2){let missing=currentWriting()[2].filter(w=>!t.toLowerCase().includes(w));r.push(['의미 점검',missing.length?'예시 표현과 다른 부분이 있습니다. 원문의 의미를 전달했는지 직접 비교해 보세요.':'예시의 핵심 표현이 포함되어 있어요. 다른 올바른 표현도 가능합니다.'])}else{let min=[0,0,50,100,200,250][l];r.push(['분량',`${countWords(t)}단어 작성. ${countWords(t)<min?'권장 분량까지 근거와 예시를 추가해 보세요.':'권장 최소 분량을 충족했어요.'}`]);r.push(['주제·논리 점검','주장과 근거가 연결되는지, 구체적인 예시가 있는지, 결론이 주제에 답하는지 확인해 보세요. 자동 주제 채점은 아직 제공되지 않습니다.'])}if(!r.some(a=>a[0]==='확인 필요'))r.unshift(['기초 점검','현재 규칙에서 명확한 오류를 찾지 못했어요. 전체 문법이 정확하다는 뜻은 아닙니다.']);data.result=r;const p=grant('writing',10,'practice:'+skillLevel('writing')+':'+currentWriting()[0]);if(p)toast('영작 제출 +'+p+' XP');render()}
function completeWriting(){if(!data.result)return;let p=finish('writing');if(!s.notes.some(a=>a.text===data.essay&&a.day===s.day))s.notes.unshift({day:s.day,text:data.essay,level:skillLevel('writing')});save();go('home');toast(p?`라이팅 완료 +${p} XP`:'저장했어요')}
const talks=[['Hello! What is your name?','안녕! 이름이 뭐야?'],['Nice to meet you! What food do you like?','만나서 반가워! 어떤 음식을 좋아하니?'],['Great! What do you do on weekends?','좋아! 주말에는 무엇을 하니?'],['Tell me about your favorite place.','네가 가장 좋아하는 장소에 대해 말해 줘.']];const advanced=[['What is a skill you would like to learn, and why?','배우고 싶은 기술과 그 이유는 무엇인가요?'],['What challenges might you face while learning it?','그것을 배우며 어떤 어려움을 겪을 수 있나요?'],['How could you overcome those challenges?','그 어려움을 어떻게 극복할 수 있을까요?'],['How might this skill change your future?','이 기술이 당신의 미래를 어떻게 바꿀 수 있을까요?']];function talk(){return (li('speaking')<2?talks:advanced)[Math.min(data.turn,3)]}function speak(t,rate){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('이 브라우저는 음성 재생을 지원하지 않아요');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.9;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('음성 재생을 사용할 수 없어요')};speechSynthesis.speak(u)}catch(e){toast('음성 재생 실패')}}function speakingView(){let q=talk();return `${back('Speaking')}<button class="chip" onclick="nextTalk()">다른 대화 주제</button><div class="card row"><img class="avatar" style="width:58px;height:58px" src="${IMG[s.skin]||IMG.listen}"><div><h3 style="margin:0">Tutor ${esc(s.name)}</h3><span class="muted">상황별 대화 · 연습 모드</span></div></div><div class="card"><div class="chatlog">${data.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.t)}</div>`).join('')}${data.done?'<div class="feedback">대화 연습을 완료했어요!</div>':`<div class="bubble"><button class="btn secondary" onclick="speak(talk()[0])">▶ 음성 듣기</button> <button class="chip" onclick="speak(talk()[0],.65)">느리게</button>${data.reveal>=1?`<p>${q[0]}</p>`:''}${data.reveal>=2?`<p class="muted">${q[1]}</p>`:''}<button class="link" style="display:block;margin-top:10px" onclick="data.reveal=(data.reveal+1)%3;render()">${['영문 자막 보기','한국어 뜻 보기','자막 숨기기'][data.reveal]}</button></div>`}</div>${data.done?`<button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('speaking')">다시 대화</button>`:`<input id="speechInput" placeholder="Type your reply…" value="${esc(data.draft||'')}" oninput="data.draft=this.value" onkeydown="if(event.key==='Enter')sendReply()"><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="recognize()">🎙️ 음성 입력</button><button class="btn" style="flex:1" onclick="sendReply()">답변 보내기</button></div><p class="muted">대화 ${data.turn+1} / 4</p>`}</div><p class="notice">미리 작성한 튜터 질문과 브라우저 음성 기능을 사용합니다. 생성형 AI 자유 대화·발음 채점은 미연동입니다. 마이크는 브라우저와 권한에 따라 사용할 수 없을 수 있습니다.</p>`}
function recognize(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('이 브라우저에서는 텍스트 입력을 사용해 주세요');try{let rec=new R();rec.lang='en-US';rec.onresult=e=>{data.draft=e.results[0][0].transcript;if($('speechInput'))$('speechInput').value=data.draft};rec.onerror=()=>toast('마이크 입력 불가 · 텍스트로 입력해 주세요');rec.start();toast('영어로 말해 주세요')}catch(e){toast('마이크를 사용할 수 없어요')}}function sendReply(){if(data.done)return;let t=$('speechInput').value.trim();if(!t||!/[a-z]/i.test(t))return toast('영어로 답해 주세요');const p=grant('speaking',10,'practice:'+skillLevel('speaking')+':'+talk()[0]);if(p)toast('대화 응답 +'+p+' XP');data.messages.push({t:talk()[0]},{t,mine:true});data.turn++;data.reveal=0;data.draft='';if(data.turn>=4){data.done=true;let p=finish('speaking');toast(p?`스피킹 +${p} XP`:'연습 완료')}render();if(!data.done)speak(talk()[0])}
const listening=[['Momo has two apples and one banana.','모모는 사과 두 개와 바나나 한 개를 가지고 있다.','How many apples does Momo have?',['One','Two','Three'],1],['I usually take the bus to school, but today I walked because the weather was nice.','나는 보통 버스로 등교하지만 오늘은 날씨가 좋아 걸었다.','How did the speaker go to school today?',['By bus','By car','On foot'],2],['The train was delayed by twenty minutes because of heavy rain, so I missed the beginning of the meeting.','폭우로 기차가 20분 늦어 회의 시작을 놓쳤다.','Why did the speaker miss the beginning?',['The train was delayed','The meeting was canceled','The speaker forgot'],0],['Although the project initially exceeded its budget, the team managed to reduce expenses by renegotiating contracts.','처음에는 예산을 초과했지만 계약을 재협상해 비용을 줄였다.','How did the team reduce expenses?',['Hiring more staff','Renegotiating contracts','Delaying payment'],1],['The findings suggest that access to education alone is insufficient unless broader socioeconomic barriers are also addressed.','연구 결과는 더 넓은 사회경제적 장벽도 해소하지 않으면 교육 접근만으로는 불충분하다는 점을 시사한다.','What is the key point?',['Education is irrelevant','Barriers need addressing too','Access alone is sufficient'],1],['The apparent precision of the forecast belies the considerable uncertainty inherent in its underlying assumptions.','예측의 겉보기 정밀함은 기저 가정에 내재한 상당한 불확실성을 가린다.','What is implied about the forecast?',['It is entirely reliable','It has no assumptions','Its precision may be misleading'],2]];

const test=[['I ____ a student.',['am','is','are'],0],['She ____ to school yesterday.',['go','went','goes'],1],['If I had more time, I ____ learn French.',['will','would','am'],1],['The report was delayed ____ a technical issue.',['despite','due to','instead'],1],['The evidence is inconclusive. What does this mean?',['It proves the claim.','It does not settle the question.','It is irrelevant.'],1],['Not until the data were reviewed ____ the error apparent.',['the error became','did the error become','became the error'],1],['Choose the closest meaning of “equivocal.”',['Unambiguous','Ambiguous','Unnecessary'],1],['The apparent agreement belies deeper divisions. What does this imply?',['Agreement hides disagreement.','Divisions no longer exist.','The agreement is explicit.'],0]];test[5][0]='Not until the data were reviewed ____ apparent.';function testView(){let q=test[data.i];if(!q)return `<div class="card center"><img class="mascot-inline cool" src="${IMG[s.skin]||IMG.cool}"><h2>진단 결과</h2><div class="big">${s.level}</div><p>${data.score} / ${test.length} 정답</p><p class="muted">문법·어휘 중심의 간단한 레벨 추정입니다. 정식 CEFR 인증이나 5개 영역 평가가 아닙니다.</p><button class="btn wide" onclick="go('profile')">영역별 레벨 설정</button><button class="btn secondary wide" onclick="go('home')">학습 시작</button></div>`;return `${back('레벨 테스트','home')}<p class="muted">문항 ${data.i+1} / ${test.length}</p><div class="progress"><i style="width:${data.i/test.length*100}%"></i></div><div class="card"><div class="question">${q[0]}</div>${q[1].map((a,i)=>`<button class="choice ${data.selected===i?'selected':''}" onclick="data.selected=${i};render()">${esc(a)}</button>`).join('')}<button class="btn wide" ${data.selected<0?'disabled':''} onclick="nextTest()">다음</button></div>`}function nextTest(){if(data.selected===test[data.i][2])data.score++;data.i++;data.selected=-1;if(data.i===test.length){s.level=levels[Math.min(5,Math.floor(data.score*6/9))];s.skillLevels={};s.tested=true;save()}render()}

function estimate(){const rows=placementState.answers;const bySkill={};for(const k of TYPES){const rs=rows.filter(a=>a.type===k);const good=rs.filter(a=>a.ok).map(a=>a.level);const bad=rs.filter(a=>!a.ok).map(a=>a.level);let v=good.length?Math.max(...good):0;if(bad.length&&Math.min(...bad)<=v)v=Math.max(0,Math.min(v,Math.min(...bad)));bySkill[k]=v;}const level=Math.round(TYPES.reduce((sum,k)=>sum+bySkill[k],0)/3);return {level:levels[level],score:rows.filter(a=>a.ok).length,bySkill};}

 for(const r of [extra[l],...readingSets[l]])placement.push({type:'reading',level:l,passage:r[1],q:r[2],choices:r[3],correct:r[4]});

function nextAdaptive(){const i=placementState.answers.length;if(i>=LIMIT)return null;const type=TYPES[i%3],target=placementState.difficulty[type];const used=new Set(placementState.answers.map(a=>a.id));let candidates=placement.map((q,id)=>({...q,id})).filter(q=>q.type===type&&!used.has(q.id));candidates.sort((a,b)=>Math.abs(a.level-target)-Math.abs(b.level-target)||a.id-b.id);const q=candidates[0];if(!q)return null;const shift=(i+q.id)%q.choices.length;return {...q,choices:q.choices.slice(shift).concat(q.choices.slice(0,shift)),correct:(q.correct-shift+q.choices.length)%q.choices.length};}

function checkWord(){if(data.answered||data.complete)return;const v=$('answer').value.trim();if(!v)return toast('단어를 입력해 주세요');const id=data.queue[0],q=vocab[li('vocab')][id];data.answer=v;data.ok=[q[2],...q[3]].some(a=>a.toLowerCase()===v.toLowerCase().replace(/[.!?]+$/,''));data.answered=true;data.attempts++;if(!data.ok){data.errors++;if(!data.missed.includes(id))data.missed.push(id);if(!s.words.some(w=>w.word===q[2]))s.words.push({word:q[2],meaning:q[4]});}else {const p=grant('vocab',data.review?5:10,(data.review?'review:':'')+skillLevel('vocab')+id);data.gained=p;if(p)toast('+'+p+' XP!');}save();render()}

let activeHuman=null;
function stopHuman(){if(activeHuman){activeHuman.pause();activeHuman=null;}}
const goBeforeHuman=go;
go=function(p){stopHuman();return goBeforeHuman(p)};
function humanQuestion(){const l=Math.max(0,Math.min(5,li('listening')));return humanBank[l][(data.set||0)%humanBank[l].length];}
function humanAudioMarkup(c){return `<audio id="humanAudio" controls preload="none" style="width:100%;margin-top:12px" onerror="humanAudioError()" onplay="activeHuman=this"><source src="${esc(c.url)}" type="audio/mpeg">${c.fallback?`<source src="${esc(c.fallback)}" type="audio/ogg">`:''}</audio><div id="humanAudioNotice" class="notice" aria-live="polite"></div><button class="btn wide" onclick="playHuman(1)">▶ 자연 속도 재생</button><button class="btn secondary wide" onclick="playHuman(.8)">0.8배속 듣기</button>`;}
function humanAudioError(){const el=$('humanAudioNotice');if(el)el.textContent='외부 음원을 불러오지 못했어요. 네트워크를 확인하거나 아래 원본 음원 링크를 이용해 주세요.';}
function playHuman(rate){const a=$('humanAudio');if(!a)return;if(window.speechSynthesis)window.speechSynthesis.cancel();activeHuman=a;a.playbackRate=rate;try{a.currentTime=0}catch(e){}a.play().catch(humanAudioError);}
function listeningView(){const q=humanQuestion(),c=humanClips[q[0]];return `${back('Listening')}<div class="card center"><img class="mascot-inline listen" src="${IMG[s.skin]||IMG.listen}"><div class="badge">HUMAN VOICE · 실제 녹음</div><h3>Listen carefully!</h3><p class="muted">${li('listening')>=3?'여러 이야기가 이어지는 낭독이에요. 필요한 부분을 찾아 들어 보세요.':'실제 영어 녹음을 듣고 질문에 답해 보세요.'}</p>${humanAudioMarkup(c)}<p class="notice">${esc(c.credit)} · <a href="${esc(c.licenseUrl)}" target="_blank" rel="noopener">${esc(c.license)}</a> · <a href="${esc(c.source)}" target="_blank" rel="noopener">원본 및 출처</a></p></div><div class="card"><div class="eyebrow">LISTENING · ${(data.set||0)%4+1}/4</div><h3>${esc(q[1])}</h3>${q[2].map((a,i)=>`<button class="choice ${data.choice===i?'selected':''}" ${data.passed?'disabled':''} onclick="listenChoice(${i})">${esc(a)}</button>`).join('')}${data.choice>=0?`<div class="feedback ${data.passed?'':'bad'}">${data.passed?'정답이다냥! '+esc(q[4]):'다시 듣고 선택해 보세요.'}</div>`:''}${data.passed?`<button class="btn wide" onclick="nextListen()">다음 문제</button><button class="btn secondary wide" onclick="go('home')">완료</button>`:''}</div><p class="notice">음원은 외부 서버에서 재생되며 인터넷 연결이 필요해요. 난이도는 학습용 임시 분류입니다.</p>`;}
function listenChoice(i){stopHuman();data.choice=i;data.passed=i===humanQuestion()[3];if(data.passed){let p=finish('listening');toast(p?`+${p} XP!`:'연습 완료')}render()}

const originalSpeakV7=speak;
speak=function(t,rate){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return originalSpeakV7(t,rate);try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t),voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));const preferred=voices.find(v=>/enhanced|premium|neural|natural/i.test(v.name)&&/en[-_]US/i.test(v.lang))||voices.find(v=>/enhanced|premium|neural|natural/i.test(v.name))||voices.find(v=>/Samantha|Daniel|Google US English/i.test(v.name));if(preferred){u.voice=preferred;u.lang=preferred.lang}else u.lang='en-US';u.rate=rate||.9;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('음성 재생을 사용할 수 없어요')};speechSynthesis.speak(u)}catch(e){originalSpeakV7(t,rate)}};

// V8: one recording, multiple questions; completion only after all answers.
const listeningGroupsV8=humanBank.map((bank,level)=>{
 const groups=[];
 for(const q of bank){let g=groups.find(x=>x.clip===q[0]);if(!g){g={clip:q[0],questions:[]};groups.push(g)}g.questions.push(q)}
 return groups;
});
function listenStateV8(){if(!data.listenV8){const level=Math.max(0,Math.min(5,li('listening')));data.listenV8={groups:listeningGroupsV8[level],group:0,index:0,correct:0,attempts:0,choice:-1,passed:false,done:false};}return data.listenV8}
function renderListenV8(keepAudio=true){const old=$('humanAudio');render();const fresh=$('humanAudio');if(keepAudio&&old&&fresh&&old.dataset.clip===fresh.dataset.clip){fresh.replaceWith(old);activeHuman=old}}
listeningView=function(){const st=listenStateV8(),total=st.groups.reduce((n,g)=>n+g.questions.length,0);if(st.done)return `${back('Listening')}<div class="card center"><img class="mascot-inline cheer" src="${IMG[s.skin]||IMG.cheer}"><h2>오늘의 리스닝 완료!</h2><div class="big">${total}/${total}</div><p>모든 듣기 문제를 맞혔어요.</p><p class="muted">총 ${st.attempts}회 응답 · 정답 ${st.correct}개</p><button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('listening')">다시 연습하기</button></div>`;
 const g=st.groups[st.group],q=g.questions[st.index],c=humanClips[g.clip],long=g.clip>=3;
 return `${back('Listening')}<div class="card center"><img class="mascot-inline listen" src="${IMG[s.skin]||IMG.listen}"><div class="badge">HUMAN VOICE · 실제 녹음</div><h3>${long?'오늘의 집중 듣기':'짧은 듣기 연습'}</h3><p class="muted">${long?'긴 음원 하나로 여러 문제를 풀어요. 한 번 듣고 기억을 바탕으로 답해 보세요.':'짧은 표현 또는 대화를 듣고 답해 보세요.'}</p><div class="progress"><i style="width:${100*st.correct/total}%"></i></div><p class="muted">오늘의 학습 ${st.correct}/${total} · 음원 ${st.group+1}/${st.groups.length}</p>${humanAudioMarkup(c).replace('id="humanAudio"',`id="humanAudio" data-clip="${g.clip}" onloadedmetadata="listenDurationV8(this)"`)}<p id="listenDurationV8" class="notice"></p><p class="notice">${esc(c.credit)} · <a href="${esc(c.licenseUrl)}" target="_blank" rel="noopener">${esc(c.license)}</a> · <a href="${esc(c.source)}" target="_blank" rel="noopener">출처</a></p></div><div class="card"><div class="eyebrow">QUESTION ${st.index+1}/${g.questions.length} · 전체 ${st.correct}/${total}</div><h3>${esc(q[1])}</h3>${q[2].map((a,i)=>`<button class="choice ${st.choice===i?'selected':''}" ${st.passed?'disabled':''} onclick="listenChoice(${i})">${esc(a)}</button>`).join('')}${st.choice>=0?`<div class="feedback ${st.passed?'':'bad'}">${st.passed?'정답이다냥! '+(st.gained?'+'+st.gained+' XP · ':'')+esc(q[4]):'다시 생각해 보세요. 필요하면 음원을 다시 들을 수 있어요.'}</div>`:''}${st.passed?`<button class="btn wide" onclick="nextListen()">${st.correct===total?'오늘 학습 완료':st.index+1===g.questions.length?'다음 음원':'다음 문제'}</button>`:''}</div><p class="notice">같은 음원에 속한 문제는 재생 위치를 유지합니다. 음원은 외부 서버에서 불러옵니다.</p>`;};
function listenDurationV8(a){const el=$('listenDurationV8');if(el&&Number.isFinite(a.duration)){const t=Math.round(a.duration);el.textContent=`음원 길이 ${Math.floor(t/60)}분 ${t%60}초${t>30?' · 여러 문항 집중 듣기':''}`}}
listenChoice=function(i){const st=listenStateV8();if(st.done||st.passed)return;const q=st.groups[st.group].questions[st.index];st.choice=i;st.attempts++;st.passed=i===q[3];if(st.passed){st.correct++;const p=grant('listening',10,'question:'+skillLevel('listening')+':'+st.groups[st.group].clip+':'+q[1]);st.gained=p;if(p)toast('+'+p+' XP!')}renderListenV8();const a=$('humanAudio');if(a)listenDurationV8(a)};

function voiceV11(){let vs=voicesV11();return vs.find(v=>v.voiceURI===s.listeningVoice)||vs.sort((a,b)=>rankVoiceV11(b)-rankVoiceV11(a))[0]}
let utteranceV11=null;
speak=function(t,rate){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('Safari 또는 Chrome에서 음성을 재생해 주세요.');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(t)),v=voiceV11();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';u.rate=rate||.93;u.pitch=1;u.volume=1;u.onerror=e=>{if(!['interrupted','canceled'].includes(e.error))toast('음성 재생 오류 · 기기의 영어 음성을 확인해 주세요.')};utteranceV11=u;speechSynthesis.speak(u)}catch(e){toast('음성을 재생할 수 없어요.')}};
function stateListenV11(){if(!data.listenV11){let level=Math.max(0,li('listening'));data.listenV11={level,index:0,correct:0,choice:-1,passed:false,reveal:false,done:false,attempts:0,questions:[listening[level],...listenSets[level]]}}return data.listenV11}
function playListenV11(rate){let st=stateListenV11();if(!st.done)speak(st.questions[st.index][0],rate)}
function toggleTranscriptV11(){let st=stateListenV11();st.reveal=!st.reveal;render()}
function selectVoiceV11(v){s.listeningVoice=v;save();if(window.speechSynthesis)speechSynthesis.cancel();}
function voiceOptionsV11(){let vs=voicesV11().sort((a,b)=>rankVoiceV11(b)-rankVoiceV11(a));return '<option value="">자동 · 자연스러운 영어 음성 우선</option>'+vs.map(v=>`<option value="${esc(v.voiceURI)}" ${s.listeningVoice===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
function refreshVoicesV11(){let el=$('voiceSelectV11');if(el)el.innerHTML=voiceOptionsV11()}
if(window.speechSynthesis&&speechSynthesis.addEventListener)speechSynthesis.addEventListener('voiceschanged',refreshVoicesV11);
listeningView=function(){let st=stateListenV11(),total=st.questions.length;if(st.done)return `${back('Listening')}<div class="card center"><img class="mascot-inline cheer" src="${IMG[s.skin]||IMG.cheer}"><h2>오늘의 리스닝 완료!</h2><div class="big">${total}/${total}</div><p>모든 문제를 맞혔어요!</p><button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('listening')">다시 연습하기</button></div>`;let q=st.questions[st.index];return `${back('Listening')}<div class="card center"><img class="mascot-inline listen" src="${IMG[s.skin]||IMG.listen}"><span class="badge">QUICK LISTENING · ${levels[st.level]}</span><h3>Listen carefully!</h3><p class="muted">문제에 필요한 영어만 재생돼요.</p><div class="progress"><i style="width:${100*st.correct/total}%"></i></div><p class="muted">오늘의 학습 ${st.correct}/${total}</p><button class="btn wide" onclick="playListenV11(.93)">▶ 듣기 / 다시 듣기</button><button class="btn secondary wide" onclick="playListenV11(.8)">🐢 느리게 듣기</button><button class="btn ghost wide" onclick="if(window.speechSynthesis)speechSynthesis.cancel()">■ 정지</button><label class="muted" for="voiceSelectV11">영어 음성 선택</label><select id="voiceSelectV11" onchange="selectVoiceV11(this.value)">${voiceOptionsV11()}</select><p class="notice">기기에 설치된 영어 음성을 사용합니다. Premium / Enhanced 음성이 있다면 선택해 보세요.</p></div><div class="card"><div class="eyebrow">QUESTION ${st.index+1}/${total}</div><h3>${esc(q[2])}</h3>${q[3].map((a,i)=>`<button class="choice ${st.choice===i?'selected':''}" ${st.passed?'disabled':''} onclick="listenChoice(${i})">${esc(a)}</button>`).join('')}${st.choice>=0?`<div class="feedback ${st.passed?'':'bad'}">${st.passed?'정답이다냥! '+(st.gained?'+'+st.gained+' XP':''):'다시 듣고 도전해 보세요.'}</div>`:''}${st.passed?`<button class="link" onclick="toggleTranscriptV11()">${st.reveal?'스크립트 숨기기':'스크립트와 해석 보기'}</button>${st.reveal?`<p>${esc(q[0])}</p><p class="muted">${esc(q[1])}</p>`:''}<button class="btn wide" onclick="nextListen()">${st.correct===total?'오늘 학습 완료':'다음 문제'}</button>`:''}</div>`};
listenChoice=function(i){let st=stateListenV11();if(st.done||st.passed)return;let q=st.questions[st.index];st.choice=i;st.attempts++;st.passed=i===q[4];if(st.passed){st.correct++;st.gained=grant('listening',10,'short:'+levels[st.level]+':'+q[2]);if(st.gained)toast('+'+st.gained+' XP!')}render()};
nextListen=function(){let st=stateListenV11();if(!st.passed||st.done)return;if(window.speechSynthesis)speechSynthesis.cancel();st.index++;st.choice=-1;st.passed=false;st.reveal=false;if(st.index>=st.questions.length){st.done=true;finish('listening');toast('오늘의 리스닝 완료!')}render()};

render();save();
</script></body></html>
