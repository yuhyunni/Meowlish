form:translateX(-50%);width:68%;height:20px;background:rgba(97,70,43,.13);filter:blur(8px);border-radius:50%}.hero img,.mascot-inline{display:block;position:relative;z-index:1;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(74,45,24,.18))}.hero img{width:min(100%,220px);max-height:185px;align-self:end;animation:floaty 3.2s ease-in-out infinite}.hero h1{font-size:23px;line-height:1.25;margin:6px 0 8px;letter-spacing:-.8px}.mascot-inline{width:136px;height:auto;margin-inline:auto;animation:floaty 3.4s ease-in-out infinite}.mascot-inline.small{width:120px}.mascot-inline.cool{animation:sway 3.6s ease-in-out infinite}.mascot-inline.listen{animation:bouncey 2.8s ease-in-out infinite}.mascot-inline.read{animation:floaty 3.5s ease-in-out infinite}.mascot-inline.cheer{animation:bouncey 2.9s ease-in-out infinite}.mascot-badge{display:inline-flex;align-items:center;gap:6px;background:#fffaf2;border:1px solid #ecd9be;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#8e5c2e}.mascot-callout{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.mascot-callout .speech{flex:1;min-width:0}.mascot-mini-stage{position:relative;display:flex;justify-content:center;align-items:flex-end;min-width:140px}.mascot-mini-stage::before{content:'';position:absolute;bottom:8px;width:92px;height:16px;border-radius:50%;background:rgba(97,70,43,.12);filter:blur(7px)}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes bouncey{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.02)}55%{transform:translateY(0) scale(.98)}}@keyframes sway{0%,100%{transform:translateY(0) rotate(0deg)}25%{transform:translateY(-4px) rotate(-2deg)}75%{transform:translateY(-4px) rotate(2deg)}}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:900;color:var(--deep)}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#7b6347}.progress{height:9px;border-radius:99px;background:#e9d6b8;overflow:hidden;margin:12px 0 4px}.progress i{display:block;height:100%;background:var(--orange);border-radius:inherit;transition:width .3s}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sectionhead h2,h2{font-size:20px;letter-spacing:-.5px;margin:0}h3{margin:0 0 8px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:21px;padding:15px;min-height:125px;box-shadow:var(--shadow);background:var(--paper);position:relative}.tile:last-child{grid-column:1/-1;min-height:100px}.tile .emoji{font-size:26px;margin-bottom:4px}.tile strong{font-size:18px;letter-spacing:-.4px}.tile small{color:#6f625a}.tile .xp{position:absolute;right:12px;top:14px;font-size:11px;font-weight:800;color:#755b42}.tile.done{border-color:#92c5a8}.card{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin:12px 0}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:grid;gap:10px}.btn{padding:13px 16px;background:var(--orange);color:#fff;border-radius:14px;font-weight:800;box-shadow:0 3px 0 #bd622c;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #bd622c}.btn.secondary{background:#f4e8d8;color:#65432f;box-shadow:none}.btn.ghost{background:transparent;color:var(--deep);box-shadow:none;border:1px solid var(--line)}.wide{width:100%;margin-top:10px}.back{background:transparent;color:var(--deep);padding:4px 0;font-weight:800;margin-bottom:8px}input,textarea,select{width:100%;border:1.5px solid #e6d6c1;border-radius:13px;padding:12px;background:#fffefa;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:var(--orange)}textarea{min-height:135px;resize:vertical}.question{font-size:22px;line-height:1.5;font-weight:800;margin:14px 0}.feedback{background:#f0f7ed;border:1px solid #d0e4cb;border-radius:14px;padding:14px;margin:12px 0;color:#326749}.feedback.bad{background:#fff1e6;border-color:#eed7bf;color:#934b26}.choice{width:100%;padding:12px;text-align:left;background:#fffefa;border:1.5px solid var(--line);border-radius:13px;margin:5px 0}.choice.selected{border-color:var(--orange);background:#fff0db}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);background:#fffdf8f5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(12px)}.nav button{background:none;display:grid;justify-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px}.nav button span{font-size:22px;line-height:1.2}.nav button.active{color:var(--deep);font-weight:900}.nav button.active span{background:#ffebcf;border-radius:12px;padding:2px 13px}.notice{font-size:12px;color:var(--muted);margin:12px 0;line-height:1.5}.levelbar{display:flex;gap:6px;flex-wrap:wrap}.levelbar button,.chip{border-radius:99px;border:1px solid var(--line);background:var(--paper);padding:7px 12px;font-size:13px;font-weight:700}.levelbar button.active,.chip.active{background:#f6d6aa;border-color:#e2b477;color:#85461f}.rank{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid #f2e9dd}.rank.me{background:#fff0d7;border-radius:12px;border:0}.rank .pos{width:26px;text-align:center;font-weight:900;color:#94714b}.rank .score{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover}.skin img{width:100%;max-height:145px;object-fit:contain;display:block;background:radial-gradient(circle at 50% 38%,#fff7ec 0%,#fffaf4 48%,#fff3dd 100%);border-radius:18px;padding:10px;filter:drop-shadow(0 8px 14px rgba(79,50,28,.12))}.skin{background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:18px;text-align:center}.skin .btn{font-size:13px;padding:9px;width:100%;margin-top:8px}.passage{font:18px/1.8 Georgia,serif;white-space:pre-line}.passage span{cursor:pointer;border-bottom:1px dotted #d18b50}.bubble{background:#f7eddf;padding:13px;border-radius:17px 17px 17px 4px;margin:10px 0;max-width:93%}.bubble.mine{margin-left:auto;background:#ffe2bd;border-radius:17px 17px 4px 17px}.chatlog{max-height:370px;overflow:auto}.center{text-align:center}.big{font-size:38px;font-weight:900;color:var(--deep)}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#392e26;color:white;padding:11px 18px;border-radius:99px;z-index:50;box-shadow:0 4px 16px #0002;font-weight:700;white-space:nowrap}.link{background:none;color:var(--deep);font-weight:800;text-decoration:underline}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.mini{font-size:12px}.badge{display:inline-block;background:#f8e7cc;border-radius:8px;color:#8c5327;font-weight:800;font-size:12px;padding:4px 8px}.divider{height:1px;background:var(--line);margin:14px 0}.book{display:flex;align-items:center;gap:12px}.book img{width:86px;border-radius:15px}.empty{padding:15px;text-align:center;color:var(--muted)}@media(min-width:550px){#app{padding:24px 24px 110px}.hero h1{font-size:30px}.hero{min-height:245px}.tile{min-height:140px}.hero>div{padding:26px}.hero img{max-height:205px}}@media(max-width:430px){.hero{grid-template-columns:1fr;min-height:auto}.hero .mascot-stage{padding:0 10px 10px;min-height:145px;order:-1}.hero>div{padding-top:8px}.hero .speech{font-size:12px}.mascot-callout{justify-content:center}}@media(max-width:355px){#app{padding:12px 12px 105px}.stats{gap:3px}.pill{padding:5px 6px}.brand{font-size:22px}.hero h1{font-size:20px}.hero>div{padding:13px}}

const defaults=()=>({name:'모모',level:'B1',skillLevels:{},xp:0,coins:0,weekly:0,done:{},earned:{},words:[],notes:[],read:{},skin:'cheer',owned:['cheer'],tested:false,club:'치즈 탐험대',day:new Date().toLocaleDateString('en-CA'),week:weekKey(),streak:0,lastStudy:''});
function weekKey(){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.toLocaleDateString('en-CA')}
let s;try{s={...defaults(),...JSON.parse(localStorage.getItem('meowlish-v1')||'{}')}}catch(e){s=defaults()}if(s.day!==defaults().day){s.done={};s.earned={};s.day=defaults().day}if(s.week!==weekKey()){s.weekly=0;s.week=weekKey()}
let screen='home', data={},toastTimer;const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('meowlish-v1',JSON.stringify(s))}catch(e){}}function toast(t){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),2200)}
function grant(k,n,unique){let key=k+':'+unique;if(s.earned[key])return 0;s.earned[key]=1;s.xp+=n;s.weekly+=n;s.coins+=Math.max(1,Math.floor(n/5));let now=s.day;if(s.lastStudy!==now){let prev=new Date();prev.setDate(prev.getDate()-1);s.streak=s.lastStudy===prev.toLocaleDateString('en-CA')?s.streak+1:1;s.lastStudy=now}save();return n}function finish(k,n=100){let p=grant(k,n,'complete');s.done[k]=true;if(skills.every(a=>s.done[a[0]])){let b=grant('all',150,'bonus');if(b)toast('전 영역 완료! +150 XP')}save();return p}function skillLevel(k){return s.skillLevels[k]||s.level}function li(k){return levels.indexOf(skillLevel(k))}function go(p){if(window.speechSynthesis)window.speechSynthesis.cancel();screen=p;data={};if(p==='vocab')data={i:0,answered:false,correct:0};if(p==='reading')data={page:s.read[skillLevel('reading')]||0,choice:-1};if(p==='speaking')data={turn:0,reveal:0,messages:[],mode:0,done:false};if(p==='listening')data={reveal:0,choice:-1};if(p==='test')data={i:0,score:0,selected:-1};if(p==='rank')data={tab:0};render();window.scrollTo(0,0)}
function nav(){let items=[['home','⌂','홈'],['learn','▤','학습'],['rank','🏆','리그'],['club','🐾','클럽'],['profile','☺','마이']];return `<nav class="nav">${items.map(([p,i,t])=>`<button class="${screen===p||(p==='learn'&&skills.some(a=>a[0]===screen))?'active':''}" onclick="go('${p}')"><span>${i}</span>${t}</button>`).join('')}</nav>`}
function header(){return `<header><div class="brand" onclick="go('home')" role="button" tabindex="0">meow<span>lish.</span> <small style="font-size:15px">🐾</small></div><div class="stats"><span class="pill">🔥 ${s.streak}</span><span class="pill">🪙 ${s.coins}</span><span class="pill">⚡ ${s.xp}</span></div></header>`}function back(t,k){return `<button class="back" onclick="go('${k||'learn'}')">‹ 돌아가기</button><div class="row between"><h2>${t}</h2><span class="badge">${skillLevel(screen)}</span></div>`}
function tiles(){return `<div class="grid">${skills.map(([k,e,n,d,x,b])=>`<button class="tile ${s.done[k]?'done':''}" style="background:${b}" onclick="go('${k}')"><span class="xp">${s.done[k]?'✓ 완료':`+${x} XP`}</span><span class="emoji">${e}</span><strong>${n}</strong><small>${d}</small></button>`).join('')}</div>`}
function home(){let n=skills.filter(a=>s.done[a[0]]).length;let mascotTalk=n===5?'오늘도 다 해냈다냥! 쉬엄쉬엄 복습도 해보자.':'오늘은 어떤 영어 미션부터 할까냥?';return `<div class="hero"><div><div class="eyebrow">YOUR STUDY BUDDY · ${s.level}</div><h1>${n===5?'오늘도 해냈다냥!':`안녕! ${esc(s.name)}와<br>영어 공부하자냥!`}</h1><div class="muted">하루 5가지, 조금씩 성장하기</div><div class="progress"><i style="width:${n*20}%"></i></div><div class="muted">오늘의 미션 ${n} / 5 완료</div><div class="speech">💬 ${mascotTalk}</div></div><div class="mascot-stage"><img alt="고양이 학습 친구" src="${IMG[s.skin]||IMG.cheer}"></div></div>${!s.tested?`<div class="card row between"><div><strong>내 영어 레벨은?</strong><div class="muted">짧은 CEFR 참고 진단으로 시작해요.</div></div><button class="btn" onclick="go('test')">테스트</button></div>`:''}<div class="card mascot-callout"><div class="mascot-mini-stage"><img class="mascot-inline cheer" src="${IMG.cheer}" alt="응원하는 고양이"></div><div class="speech"><strong>${esc(s.name)}</strong>가 네 공부를 응원 중이야. 단어를 맞히면 기뻐하고, 리스닝을 하면 같이 신나게 들어!</div></div><div class="sectionhead"><h2>오늘의 학습</h2><span class="muted">DAILY QUEST</span></div>${tiles()}<div class="sectionhead"><h2>고양이의 선물</h2></div><div class="card row between"><div><strong>🎁 올클리어 보너스</strong><div class="muted">5개 영역 완료 시 150 XP</div></div><button class="btn secondary" onclick="go('shop')">스킨 상점</button></div><div class="notice">학습 기록은 이 브라우저에 저장돼요. 첫 버전은 연습용 콘텐츠와 모의 리그를 사용합니다.</div>`}

function vocabView(){let qs=vocab[li('vocab')],q=qs[data.i];if(!q)return `<div class="card center"><img class="mascot-inline cheer" src="${IMG.cheer}"><h2>단어 세트 완료!</h2><div class="big">${data.correct}/${qs.length}</div><p>오늘의 단어 학습 보상을 받았어요.</p><button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('vocab')">다시 연습</button></div>`;return `${back('Vocabulary')}<div class="sectionhead"><span class="muted">문맥에 맞는 단어를 입력하세요.</span><strong>${data.i+1} / ${qs.length}</strong></div><div class="progress"><i style="width:${data.i/qs.length*100}%"></i></div><div class="card"><div class="eyebrow">FILL IN THE BLANK</div><div class="question">${q[0].replace('____','<span style="color:#d57c36">_______</span>')}</div><p>${q[1]}</p><input id="answer" placeholder="영어 단어 입력" autocomplete="off" autocapitalize="none" value="${esc(data.answer||'')}" ${data.answered?'disabled':''} onkeydown="if(event.key==='Enter')checkWord()">${data.answered?`<div class="feedback ${data.ok?'':'bad'}"><strong>${data.ok?'정답이다냥!':'기본 답안: '+q[2]}</strong><div>${q[4]}</div><div class="mini">${data.ok?`+${data.gained} XP`:'미등록 유의어일 수 있어요. 실제 AI 판단은 아직 연결되지 않았습니다.'}</div></div><button class="btn wide" onclick="nextWord()">다음 문제</button>`:`<button class="btn wide" onclick="checkWord()">정답 확인</button><button class="btn ghost wide" onclick="toast('힌트: ${q[2][0]}로 시작해요')">힌트</button>`}</div><div class="notice">현재는 문장별로 등록한 유의어를 인정하는 데모 채점입니다.</div>`}
function checkWord(){if(data.answered)return;let v=$('answer').value.trim();if(!v)return toast('단어를 입력해 주세요');let q=vocab[li('vocab')][data.i];data.answer=v;data.ok=q[3].includes(v.toLowerCase().replace(/[.!?]+$/,''));data.answered=true;data.gained=data.ok?grant('vocab',10,skillLevel('vocab')+data.i):0;if(data.ok)data.correct++;else if(!s.words.some(w=>w.word===q[2]))s.words.push({word:q[2],meaning:q[4]});save();render()}
function nextWord(){data.i++;data.answered=false;data.answer='';if(data.i===5)finish('vocab',50);render()}

function passageHTML(q){return q[1].split(/(\b[A-Za-z]+\b)/).map(t=>q[5][t.toLowerCase()]?`<span onclick="showWord('${t.toLowerCase()}')">${t}</span>`:esc(t)).join('')}function currentReading(){return (data.page%2===0?readings:extra)[li('reading')]}function showWord(w){let meaning=currentReading()[5][w];data.word=w;data.meaning=meaning;render()}function addWord(){if(!s.words.some(w=>w.word===data.word)){s.words.push({word:data.word,meaning:data.meaning});save()}toast('나의 단어장에 저장했어요')}
function readingView(){let q=currentReading();return `${back('Reading')}<div class="card book"><img src="${IMG.read}"><div><span class="eyebrow">MOMO'S LIBRARY</span><h3>${q[0]}</h3><div class="muted">Day ${data.page+1} · 창작 수준별 리딩</div></div></div><div class="card"><div class="row between"><span class="badge">PAGE ${data.page+1}</span><button class="chip" onclick="speak(currentReading()[1])">🔊 듣기</button></div><p class="passage">${passageHTML(q)}</p><div class="muted">밑줄 친 단어를 터치하면 뜻을 확인할 수 있어요.</div>${data.word?`<div class="feedback"><strong>${esc(data.word)}</strong> · ${esc(data.meaning)}<button class="btn secondary wide" onclick="addWord()">단어장에 추가</button></div>`:''}</div><div class="card"><h3>내용 이해 확인</h3><p><b>${q[2]}</b></p>${q[3].map((a,i)=>`<button class="choice ${data.choice===i?'selected':''}" ${data.passed?'disabled':''} onclick="readChoice(${i})">${esc(a)}</button>`).join('')}${data.choice>=0?`<div class="feedback ${data.passed?'':'bad'}">${data.passed?'정답! 내용을 잘 이해했어요.':'다시 읽고 도전해 보세요.'}</div>`:''}${data.passed?`<button class="btn wide" onclick="nextRead()">다음 페이지</button><button class="btn secondary wide" onclick="go('home')">오늘 학습 마치기</button>`:''}</div><p class="notice">현재 각 수준별로 2편의 자체 창작 예시를 제공합니다. 정식 연재 도서 및 뉴스는 미연동입니다.</p>`}
function readChoice(i){data.choice=i;data.passed=i===currentReading()[4];if(data.passed){let p=finish('reading');s.read[skillLevel('reading')]=Math.max(s.read[skillLevel('reading')]||0,data.page+1);save();toast(p?`+${p} XP!`:'오늘 보상은 이미 받았어요')}render()}function nextRead(){data.page++;data.choice=-1;data.passed=false;data.word='';render();window.scrollTo(0,0)}

function countWords(t){return t.trim()?t.trim().split(/\s+/).length:0}function gradeWriting(){let t=$('essay').value.trim(),l=li('writing');if(countWords(t)<2||!/[a-z]/i.test(t))return toast('영어로 답안을 작성해 주세요');data.essay=t;let r=[];if(!/^[A-Z]/.test(t))r.push(['확인 필요','문장 첫 글자를 대문자로 시작하는지 확인하세요.']);if(!/[.!?]["']?$/.test(t))r.push(['확인 필요','문장 마지막에 적절한 문장부호를 사용했는지 확인하세요.']);if(/\bI am\b.*\byesterday\b|\byesterday\b.*\bI am\b/i.test(t))r.push(['확인 필요','yesterday와 현재형 am이 함께 있습니다. 과거 시제 was가 필요한지 확인하세요.']);if(/\bhe go\b|\bshe go\b|\bhe have\b|\bshe have\b/i.test(t))r.push(['확인 필요','3인칭 단수 주어와 동사의 일치를 확인하세요.']);if(l<2){let missing=writing[l][2].filter(w=>!t.toLowerCase().includes(w));r.push(['의미 점검',missing.length?'예시 표현과 다른 부분이 있습니다. 원문의 의미를 전달했는지 직접 비교해 보세요.':'예시의 핵심 표현이 포함되어 있어요. 다른 올바른 표현도 가능합니다.'])}else{let min=[0,0,50,100,200,250][l];r.push(['분량',`${countWords(t)}단어 작성. ${countWords(t)<min?'권장 분량까지 근거와 예시를 추가해 보세요.':'권장 최소 분량을 충족했어요.'}`]);r.push(['주제·논리 점검','주장과 근거가 연결되는지, 구체적인 예시가 있는지, 결론이 주제에 답하는지 확인해 보세요. 자동 주제 채점은 아직 제공되지 않습니다.'])}if(!r.some(a=>a[0]==='확인 필요'))r.unshift(['기초 점검','현재 규칙에서 명확한 오류를 찾지 못했어요. 전체 문법이 정확하다는 뜻은 아닙니다.']);data.result=r;render()}
function completeWriting(){if(!data.result)return;let p=finish('writing');if(!s.notes.some(a=>a.text===data.essay&&a.day===s.day))s.notes.unshift({day:s.day,text:data.essay,level:skillLevel('writing')});save();go('home');toast(p?`라이팅 완료 +${p} XP`:'저장했어요')}
const talks=[['Hello! What is your name?','안녕! 이름이 뭐야?'],['Nice to meet you! What food do you like?','만나서 반가워! 어떤 음식을 좋아하니?'],['Great! What do you do on weekends?','좋아! 주말에는 무엇을 하니?'],['Tell me about your favorite place.','네가 가장 좋아하는 장소에 대해 말해 줘.']];const advanced=[['What is a skill you would like to learn, and why?','배우고 싶은 기술과 그 이유는 무엇인가요?'],['What challenges might you face while learning it?','그것을 배우며 어떤 어려움을 겪을 수 있나요?'],['How could you overcome those challenges?','그 어려움을 어떻게 극복할 수 있을까요?'],['How might this skill change your future?','이 기술이 당신의 미래를 어떻게 바꿀 수 있을까요?']];function talk(){return (li('speaking')<2?talks:advanced)[Math.min(data.turn,3)]}function speak(t,rate){if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('이 브라우저는 음성 재생을 지원하지 않아요');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.9;u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('음성 재생을 사용할 수 없어요')};speechSynthesis.speak(u)}catch(e){toast('음성 재생 실패')}}function speakingView(){let q=talk();return `${back('Speaking')}<div class="card row"><img class="avatar" style="width:58px;height:58px" src="${IMG.listen}"><div><h3 style="margin:0">Tutor ${esc(s.name)}</h3><span class="muted">상황별 대화 · 연습 모드</span></div></div><div class="card"><div class="chatlog">${data.messages.map(m=>`<div class="bubble ${m.mine?'mine':''}">${esc(m.t)}</div>`).join('')}${data.done?'<div class="feedback">대화 연습을 완료했어요!</div>':`<div class="bubble"><button class="btn secondary" onclick="speak(talk()[0])">▶ 음성 듣기</button> <button class="chip" onclick="speak(talk()[0],.65)">느리게</button>${data.reveal>=1?`<p>${q[0]}</p>`:''}${data.reveal>=2?`<p class="muted">${q[1]}</p>`:''}<button class="link" style="display:block;margin-top:10px" onclick="data.reveal=(data.reveal+1)%3;render()">${['영문 자막 보기','한국어 뜻 보기','자막 숨기기'][data.reveal]}</button></div>`}</div>${data.done?`<button class="btn wide" onclick="go('home')">홈으로</button><button class="btn secondary wide" onclick="go('speaking')">다시 대화</button>`:`<input id="speechInput" placeholder="Type your reply…" value="${esc(data.draft||'')}" oninput="data.draft=this.value" onkeydown="if(event.key==='Enter')sendReply()"><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="recognize()">🎙️ 음성 입력</button><button class="btn" style="flex:1" onclick="sendReply()">답변 보내기</button></div><p class="muted">대화 ${data.turn+1} / 4</p>`}</div><p class="notice">미리 작성한 튜터 질문과 브라우저 음성 기능을 사용합니다. 생성형 AI 자유 대화·발음 채점은 미연동입니다. 마이크는 브라우저와 권한에 따라 사용할 수 없을 수 있습니다.</p>`}
function recognize(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('이 브라우저에서는 텍스트 입력을 사용해 주세요');try{let rec=new R();rec.lang='en-US';rec.onresult=e=>{data.draft=e.results[0][0].transcript;if($('speechInput'))$('speechInput').value=data.draft};rec.onerror=()=>toast('마이크 입력 불가 · 텍스트로 입력해 주세요');rec.start();toast('영어로 말해 주세요')}catch(e){toast('마이크를 사용할 수 없어요')}}function sendReply(){if(data.done)return;let t=$('speechInput').value.trim();if(!t||!/[a-z]/i.test(t))return toast('영어로 답해 주세요');data.messages.push({t:talk()[0]},{t,mine:true});data.turn++;data.reveal=0;data.draft='';if(data.turn>=4){data.done=true;let p=finish('speaking');toast(p?`스피킹 +${p} XP`:'연습 완료')}render();if(!data.done)speak(talk()[0])}
const listening=[['Momo has two apples and one banana.','모모는 사과 두 개와 바나나 한 개를 가지고 있다.','How many apples does Momo have?',['One','Two','Three'],1],['I usually take the bus to school, but today I walked because the weather was nice.','나는 보통 버스로 등교하지만 오늘은 날씨가 좋아 걸었다.','How did the speaker go to school today?',['By bus','By car','On foot'],2],['The train was delayed by twenty minutes because of heavy rain, so I missed the beginning of the meeting.','폭우로 기차가 20분 늦어 회의 시작을 놓쳤다.','Why did the speaker miss the beginning?',['The train was delayed','The meeting was canceled','The speaker forgot'],0],['Although the project initially exceeded its budget, the team managed to reduce expenses by renegotiating contracts.','처음에는 예산을 초과했지만 계약을 재협상해 비용을 줄였다.','How did the team reduce expenses?',['Hiring more staff','Renegotiating contracts','Delaying payment'],1],['The findings suggest that access to education alone is insufficient unless broader socioeconomic barriers are also addressed.','연구 결과는 더 넓은 사회경제적 장벽도 해소하지 않으면 교육 접근만으로는 불충분하다는 점을 시사한다.','What is the key point?',['Education is irrelevant','Barriers need addressing too','Access alone is sufficient'],1],['The apparent precision of the forecast belies the considerable uncertainty inherent in its underlying assumptions.','예측의 겉보기 정밀함은 기저 가정에 내재한 상당한 불확실성을 가린다.','What is implied about the forecast?',['It is entirely reliable','It has no assumptions','Its precision may be misleading'],2]];
function listeningView(){let q=listening[li('listening')];return `${back('Listening')}<div class="card center"><img class="mascot-inline listen" src="${IMG.listen}"><h3>Listen carefully!</h3><p class="muted">먼저 자막 없이 영어를 들어 보세요.</p><button class="btn wide" onclick="speak(listening[li('listening')][0])">▶ 재생</button><button class="btn secondary wide" onclick="speak(listening[li('listening')][0],.65)">느리게 듣기</button><button class="link" style="margin-top:14px" onclick="data.reveal=(data.reveal+1)%3;render()">${['영문 자막 보기','한국어 뜻 보기','자막 숨기기'][data.reveal]}</button>${data.reveal>=1?`<p>${q[0]}</p>`:''}${data.reveal>=2?`<p class="muted">${q[1]}</p>`:''}</div><div class="card"><h3>${q[2]}</h3>${q[3].map((a,i)=>`<button class="choice ${data.choice===i?'selected':''}" ${data.passed?'disabled':''} onclick="listenChoice(${i})">${a}</button>`).join('')}${data.choice>=0?`<div class="feedback ${data.passed?'':'bad'}">${data.passed?'정답이다냥!':'다시 듣고 선택해 보세요.'}</div>`:''}${data.passed?`<button class="btn wide" onclick="go('home')">완료</button>`:''}</div>`}function listenChoice(i){data.choice=i;data.passed=i===listening[li('listening')][4];if(data.passed){let p=finish('listening');toast(p?`+${p} XP!`:'연습 완료')}render()}
const test=[['I ____ a student.',['am','is','are'],0],['She ____ to school yesterday.',['go','went','goes'],1],['If I had more time, I ____ learn French.',['will','would','am'],1],['The report was delayed ____ a technical issue.',['despite','due to','instead'],1],['The evidence is inconclusive. What does this mean?',['It proves the claim.','It does not settle the question.','It is irrelevant.'],1],['Not until the data were reviewed ____ the error apparent.',['the error became','did the error become','became the error'],1],['Choose the closest meaning of “equivocal.”',['Unambiguous','Ambiguous','Unnecessary'],1],['The apparent agreement belies deeper divisions. What does this imply?',['Agreement hides disagreement.','Divisions no longer exist.','The agreement is explicit.'],0]];test[5][0]='Not until the data were reviewed ____ apparent.';function testView(){let q=test[data.i];if(!q)return `<div class="card center"><img class="mascot-inline cool" src="${IMG.cool}"><h2>진단 결과</h2><div class="big">${s.level}</div><p>${data.score} / ${test.length} 정답</p><p class="muted">문법·어휘 중심의 간단한 레벨 추정입니다. 정식 CEFR 인증이나 5개 영역 평가가 아닙니다.</p><button class="btn wide" onclick="go('profile')">영역별 레벨 설정</button><button class="btn secondary wide" onclick="go('home')">학습 시작</button></div>`;return `${back('레벨 테스트','home')}<p class="muted">문항 ${data.i+1} / ${test.length}</p><div class="progress"><i style="width:${data.i/test.length*100}%"></i></div><div class="card"><div class="question">${q[0]}</div>${q[1].map((a,i)=>`<button class="choice ${data.selected===i?'selected':''}" onclick="data.selected=${i};render()">${esc(a)}</button>`).join('')}<button class="btn wide" ${data.selected<0?'disabled':''} onclick="nextTest()">다음</button></div>`}function nextTest(){if(data.selected===test[data.i][2])data.score++;data.i++;data.selected=-1;if(data.i===test.length){s.level=levels[Math.min(5,Math.floor(data.score*6/9))];s.skillLevels={};s.tested=true;save()}render()}
const names=['Sunny','Luna','Oliver','Mia','Nabi','Leo','Bori','Alex','Sophie','Coco','Jamie','Chloe','Noah','Milo','Bella','Charlie','Daisy','Hana','Yuki','Max','Toby','Ruby','Pepper','Eli','Cookie','Finn','Juno','Haru','Nori'];const faces=['🐱','🐈','🐈‍⬛','😺','😸'];function rankView(){let arr=names.map((n,i)=>({n,p:Math.max(40,1450-i*43+(i*73)%127),e:faces[i%5]}));arr.push({n:'나 · '+s.name,p:s.weekly,me:true});arr.sort((a,b)=>b.p-a.p);let r=arr.findIndex(a=>a.me)+1;return `<div class="hero"><div><div class="eyebrow">WEEKLY LEAGUE</div><h1>브론즈 리그</h1><div class="muted">현재 ${r}위 / 30명 · ${s.weekly} XP</div><div class="speech">🏆 ${r<=5?'승급권에 가까워!':'조금만 더 하면 순위가 오른다냥!'}</div></div><div class="mascot-stage"><img src="${IMG.cool}"></div></div><div class="card row between"><div><strong>이번 주 목표</strong><div class="muted">상위 5위에 도전해 보세요!</div></div><span class="badge">모의 리그</span></div><div class="card" style="padding:12px">${arr.map((u,i)=>`<div class="rank ${u.me?'me':''}"><span class="pos">${i<3?['🥇','🥈','🥉'][i]:i+1}</span>${u.me?`<img class="avatar" src="${IMG[s.skin]}">`:`<span style="font-size:24px">${u.e}</span>`}<span>${esc(u.n)}</span><span class="score">${u.p.toLocaleString()} XP</span></div>`).join('')}</div><div class="notice">다른 29명은 시뮬레이션 참가자입니다. 실제 무작위 매칭, 주간 승급 및 서버 동기화는 아직 연결되지 않았습니다.</div>`}
const clubs=['치즈 탐험대','책 읽는 냥이들','달빛 고양이'];function clubView(){let own=3820+s.weekly,opp=4350,total=own+opp;return `<div class="hero"><div><div class="eyebrow">CLUB BATTLE</div><h1>함께 공부하면<br>더 즐겁다냥!</h1><div class="muted">클럽 대항전 · 모의 경기</div><div class="speech">🐾 우리 클럽 점수를 올리려면 오늘 미션을 하나씩 깨보자!</div></div><div class="mascot-stage"><img src="${IMG.cheer}"></div></div><div class="card"><div class="row between"><h3>나의 클럽</h3><span class="badge">10명 · 예시</span></div><select onchange="s.club=this.value;save();render()">${clubs.map(n=>`<option ${n===s.club?'selected':''}>${n}</option>`).join('')}</select><p class="muted">내 기여 점수: ${s.weekly} XP</p><div class="divider"></div><div class="grid center"><div><div style="font-size:34px">🐱</div><b>${esc(s.club)}</b><div class="big" style="font-size:27px">${own.toLocaleString()}</div></div><div><div style="font-size:34px">🐈‍⬛</div><b>까만 발자국</b><div class="big" style="font-size:27px">${opp.toLocaleString()}</div></div></div><div class="progress"><i style="width:${own/total*100}%"></i></div><p class="center muted">${own>=opp?`${(own-opp).toLocaleString()} XP 앞서는 중`:`${(opp-own).toLocaleString()} XP 따라잡기`}</p><button class="btn wide" onclick="go('learn')">클럽을 위해 공부하기</button></div><div class="card"><div class="mascot-callout"><div class="mascot-mini-stage"><img class="mascot-inline listen" src="${IMG.listen}" alt="헤드폰 고양이"></div><div class="speech"><strong>시즌 보상</strong><br>클럽 대항전 우승 시 특별 스킨을 획득할 수 있도록 설계했어요.</div></div><span class="muted">실제 우승 보상은 온라인 서버 연동 후 제공됩니다.</span></div><div class="notice">클럽 선택과 내 XP는 저장됩니다. 상대 클럽과 팀원은 예시 데이터입니다.</div>`}
const skins=[['cheer','기본 치즈냥',0],['cool','쿨한 선글라스냥',80],['read','책 읽는 냥이',60],['listen','음악 좋아하는 냥이',60]];function shopView(){return `${back('스킨 상점','profile')}<div class="card row between"><div><h3>나만의 고양이</h3><span class="muted">학습으로 모은 코인으로 꾸며요.</span></div><span class="pill">🪙 ${s.coins}</span></div><div class="grid">${skins.map(([k,n,c])=>`<div class="skin"><img src="${IMG[k]}" alt="${n}"><strong>${n}</strong><button class="btn ${s.skin===k?'secondary':''}" ${s.skin===k?'disabled':''} onclick="buySkin('${k}')">${s.skin===k?'장착 중':s.owned.includes(k)?'장착하기':`🪙 ${c} 구매`}</button></div>`).join('')}</div><div class="notice">스킨 구매 및 장착은 기기에 저장됩니다.</div>`}function buySkin(k){let a=skins.find(x=>x[0]===k);if(!s.owned.includes(k)){if(s.coins<a[2])return toast('코인이 부족해요. 영어 미션에 도전하세요!');s.coins-=a[2];s.owned.push(k)}s.skin=k;save();render();toast('새로운 모습으로 변신!')}
function profileView(){return `<div class="card center"><img class="mascot-inline" src="${IMG[s.skin]}"><h2>${esc(s.name)}와 함께</h2><p class="muted">나의 종합 레벨 · ${s.level}</p><div class="row"><input id="catname" maxlength="20" value="${esc(s.name)}" placeholder="고양이 이름"><button class="btn" onclick="renameCat()">저장</button></div><button class="btn wide" onclick="go('shop')">고양이 스킨 꾸미기</button></div><div class="card"><h3>나의 영어 프로필</h3><div class="row between"><span>종합 레벨</span><select style="width:110px" onchange="s.level=this.value;s.tested=true;s.skillLevels={};save();render()">${levels.map(l=>`<option ${s.level===l?'selected':''}>${l}</option>`).join('')}</select></div>${skills.map(([k,e,n])=>`<div class="row between" style="margin-top:10px"><span>${e} ${n}</span><select style="width:110px" onchange="s.skillLevels['${k}']=this.value;save();render()">${levels.map(l=>`<option ${skillLevel(k)===l?'selected':''}>${l}</option>`).join('')}</select></div>`).join('')}<button class="btn secondary wide" onclick="go('test')">레벨 테스트 다시 보기</button></div><div class="card stack"><button class="btn secondary" onclick="go('words')">나의 단어장 · ${s.words.length}개</button><button class="btn secondary" onclick="go('notes')">라이팅 노트 · ${s.notes.length}개</button></div><div class="notice">이 앱은 브라우저에 학습 기록을 저장합니다. 회원가입·클라우드 백업은 미연동입니다.</div>`}function renameCat(){let n=$('catname').value.trim();if(!n)return toast('이름을 입력해 주세요');s.name=n;save();render();toast('이름을 저장했어요')}
function wordsView(){return `${back('나의 단어장','profile')}<div class="card">${s.words.length?s.words.map(w=>`<div class="rank"><div><b>${esc(w.word)}</b><div class="muted">${esc(w.meaning)}</div></div><button class="chip" style="margin-left:auto" onclick="speak(${JSON.stringify(w.word).replace(/"/g,'&quot;')})">🔊</button></div>`).join(''):'<div class="empty">리딩 또는 단어 학습에서 단어를 모아 보세요.</div>'}</div>`}function notesView(){return `${back('라이팅 노트','profile')}${s.notes.length?s.notes.map(n=>`<div class="card"><span class="badge">${esc(n.level)} · ${esc(n.day)}</span><p style="white-space:pre-wrap">${esc(n.text)}</p></div>`).join(''):'<div class="card empty">영작을 완료하면 여기에 저장됩니다.</div>'}`}
function render(){let views={home,learn:()=>`<div class="sectionhead"><h2>나의 학습실</h2><span class="badge">${s.level}</span></div>${tiles()}<div class="card"><h3>복습하기</h3><button class="btn secondary wide" onclick="go('words')">나의 단어장</button><button class="btn secondary wide" onclick="go('notes')">라이팅 노트</button></div>`,vocab:vocabView,reading:readingView,writing:writingView,speaking:speakingView,listening:listeningView,test:testView,rank:rankView,club:clubView,profile:profileView,shop:shopView,words:wordsView,notes:notesView};$('app').innerHTML=header()+(views[screen]||home)()+nav()}
render();save();
</script></body></html>
