name: Generate Meowlish Kokoro audio
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - run: pip install kokoro==0.9.4 soundfile
      - run: python kokoro-tools/generate.py
      - name: Save generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kokoro-audio
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Kokoro English audio'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-audio
          path: kokoro-audio/
